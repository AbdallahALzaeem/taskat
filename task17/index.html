 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حاسبة صافي الربح</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>حاسبة صافي الربح</h1>
    <p class="sub">سعر الساعة 30$ — التكاليف 40% — 6 أيام بالأسبوع</p>

    <label for="hoursInput">عدد ساعات الشغل باليوم</label>
    <div class="row">
      <input type="number" id="hoursInput" min="0" max="24" step="0.5" placeholder="مثلاً 8">
      <button type="button" onclick="showProfit()">احسب</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
